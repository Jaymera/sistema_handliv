services:
  redis:
    image: redis:7-alpine
    container_name: handliv_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: handliv_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads:/app/storage/uploads
      - hf_cache:/app/.cache/huggingface
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  celery_worker:
    build: ./backend
    container_name: handliv_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
      - uploads:/app/storage/uploads
      - hf_cache:/app/.cache/huggingface
    command: celery -A app.infrastructure.queue.celery_app worker --loglevel=info -E

  celery_beat:
    build: ./backend
    container_name: handliv_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.infrastructure.queue.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    container_name: handliv_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  redis_data:
  uploads:
  hf_cache: