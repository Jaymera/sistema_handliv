services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads:/app/storage/uploads
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  celery_worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.infrastructure.queue.celery_app worker --loglevel=info -E

  celery_beat:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.infrastructure.queue.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  redis_data:
  uploads:
  hf_cache: